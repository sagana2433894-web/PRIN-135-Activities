<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Travel Agency Page featuring travel packages and destinations.">
    <title>Travel Agency Page</title>
</head>

<body>

    <h1>Explore Amazing Destinations</h1>

    <p>Discover exciting travel opportunities and unforgettable adventures around the world.</p>

    <!-- Section 1: Video Section -->
    <section>
        <h2>Featured Video Tour</h2>
        <video controls width="640">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        </video>
    </section>

    <!-- Section 2: Audio Section -->
    <section>
        <h2>Travel Background Music</h2>
        <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
        </audio>
    </section>

    <h2>Packages</h2>

    <p>Choose the travel package that best fits your vacation.</p>

    <ul>
        <li>
            <a href="https://www.freecodecamp.org/learn" target="_blank">
                Group Travels
            </a>
        </li>
        <li>
            <a href="https://www.freecodecamp.org/learn" target="_blank">
                Private Tours
            </a>
        </li>
    </ul>

    <h2>Top Itineraries</h2>

    <figure>
        <a href="https://www.freecodecamp.org/learn" target="_blank">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg"
                alt="The Colosseum in Rome">
        </a>
        <figcaption>Visit the famous Colosseum in Rome.</figcaption>
    </figure>

    <figure>
        <a href="https://www.freecodecamp.org/learn" target="_blank">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg"
                alt="Snowy Alps mountains">
        </a>
        <figcaption>Enjoy the beautiful Alps.</figcaption>
    </figure>

    <figure>
        <a href="https://www.freecodecamp.org/learn" target="_blank">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg"
                alt="Clear blue sea">
        </a>
        <figcaption>Relax by the crystal-clear sea.</figcaption>
    </figure>

</body>

</html>
